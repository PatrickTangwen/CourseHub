# Prometheus 配置文件 — CourseHub 课程问答系统

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'coursehub'
    environment: 'production'

rule_files:
  - "alerts/*.yml"

scrape_configs:
  # CourseHub 主应用指标
  - job_name: 'coursehub-app'
    static_configs:
      - targets: ['coursehub:8000']
        labels:
          service: 'coursehub'
    scrape_interval: 10s
    metrics_path: '/metrics'

  # Prometheus 自监控
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
