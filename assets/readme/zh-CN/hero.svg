<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">CourseHub</title>
  <desc id="desc">一个答案有依据、过程可查看的 UCSD 双语多 Agent 课程助手。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0D0E"/>
      <stop offset="0.58" stop-color="#111516"/>
      <stop offset="1" stop-color="#1A2020"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C8A66F"/>
      <stop offset="1" stop-color="#A98655"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#D6C8AF" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#000000" flood-opacity="0.38"/>
    </filter>
  </defs>

  <rect width="1200" height="560" rx="30" fill="url(#bg)"/>
  <rect width="1200" height="560" rx="30" fill="url(#grid)"/>
  <path d="M0 475 C250 420 480 530 720 468 C915 418 1035 431 1200 386 V560 H0 Z" fill="#C8A66F" opacity="0.025"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif">
    <g transform="translate(66 58)">
      <rect width="52" height="52" rx="14" fill="#C8A66F"/>
      <path d="M13 19 H39 M18 11 V20 M34 11 V20 M14 18 V39 H38 V18" fill="none" stroke="#171717" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M21 27 H31 M21 34 H28" stroke="#171717" stroke-width="3" stroke-linecap="round"/>
      <text x="69" y="20" fill="#A9A69E" font-size="17" font-weight="700" letter-spacing="2.2">UCSD 课程智能助手</text>
      <text x="69" y="44" fill="#858A89" font-size="16">答案有依据 · 过程可查看</text>
    </g>

    <text x="64" y="214" fill="#F2EEE5" font-size="86" font-weight="780" letter-spacing="-4">CourseHub</text>
    <rect x="66" y="239" width="92" height="5" rx="3" fill="url(#gold)"/>
    <text x="66" y="282" fill="#D9D5CC" font-size="29" font-weight="650">问课程，也看见</text>
    <text x="66" y="318" fill="#A09F99" font-size="29">答案是怎样生成的。</text>

    <g font-size="16" font-weight="650">
      <rect x="66" y="354" width="104" height="38" rx="19" fill="#171C1D" stroke="#465052" stroke-opacity="0.9"/>
      <circle cx="86" cy="373" r="4" fill="#8FA18F"/>
      <text x="99" y="379" fill="#DAD6CD">中英双语</text>
      <rect x="180" y="354" width="140" height="38" rx="19" fill="#171C1D" stroke="#465052" stroke-opacity="0.9"/>
      <circle cx="200" cy="373" r="4" fill="#9AA7AA"/>
      <text x="213" y="379" fill="#DAD6CD">真实数据约束</text>
      <rect x="330" y="354" width="112" height="38" rx="19" fill="#171C1D" stroke="#465052" stroke-opacity="0.9"/>
      <circle cx="350" cy="373" r="4" fill="#C8A66F"/>
      <text x="363" y="379" fill="#DAD6CD">可自托管</text>
    </g>

    <g transform="translate(64 438)">
      <g>
        <text y="0" fill="#F2EEE5" font-size="28" font-weight="760">15</text>
        <text y="25" fill="#858A89" font-size="14" font-weight="700" letter-spacing="1.4">学期</text>
      </g>
      <line x1="73" y1="-18" x2="73" y2="32" stroke="#343B3C"/>
      <g transform="translate(98)">
        <text y="0" fill="#F2EEE5" font-size="28" font-weight="760">19K</text>
        <text y="25" fill="#858A89" font-size="14" font-weight="700" letter-spacing="1.1">课程-学期</text>
      </g>
      <line x1="212" y1="-18" x2="212" y2="32" stroke="#343B3C"/>
      <g transform="translate(238)">
        <text y="0" fill="#F2EEE5" font-size="28" font-weight="760">61K</text>
        <text y="25" fill="#858A89" font-size="14" font-weight="700" letter-spacing="1.4">SECTION</text>
      </g>
      <line x1="342" y1="-18" x2="342" y2="32" stroke="#343B3C"/>
      <g transform="translate(368)">
        <text y="0" fill="#F2EEE5" font-size="28" font-weight="760">15K</text>
        <text y="25" fill="#858A89" font-size="14" font-weight="700" letter-spacing="1.4">成绩记录</text>
      </g>
    </g>

    <g transform="translate(678 46)" filter="url(#shadow)">
      <rect width="458" height="468" rx="24" fill="#111617" stroke="#394243" stroke-width="1.5"/>
      <rect x="1" y="1" width="456" height="58" rx="23" fill="#171D1E"/>
      <circle cx="26" cy="29" r="5" fill="#7C927F"/>
      <text x="42" y="35" fill="#C8C5BD" font-size="16" font-weight="700" letter-spacing="1.3">实时回答流程</text>
      <rect x="353" y="18" width="80" height="25" rx="12.5" fill="#19211D"/>
      <text x="374" y="35" fill="#9FB1A2" font-size="13" font-weight="700">运行中</text>

      <g transform="translate(22 78)">
        <rect width="414" height="64" rx="16" fill="#1A2021" stroke="#3A4344"/>
        <text x="18" y="25" fill="#858A89" font-size="13" font-weight="700" letter-spacing="1">问题</text>
        <text x="18" y="49" fill="#E7E3DA" font-size="18" font-weight="600">FA26 谁教 CSE 101？</text>
      </g>

      <path d="M49 159 V388" fill="none" stroke="#323A3B" stroke-width="2"/>

      <g transform="translate(30 166)">
        <circle cx="19" cy="19" r="19" fill="#1B201E" stroke="#718477"/>
        <path d="M12 19 C16 13 22 13 26 19 C22 25 16 25 12 19 Z" fill="none" stroke="#9AAD9F" stroke-width="2"/>
        <circle cx="19" cy="19" r="3" fill="#9AAD9F"/>
        <text x="56" y="15" fill="#E7E3DA" font-size="17" font-weight="700">召回上下文</text>
        <text x="56" y="36" fill="#858A89" font-size="14">工作记忆 · 情景记忆 · 用户画像</text>
      </g>

      <g transform="translate(30 226)">
        <circle cx="19" cy="19" r="19" fill="#182022" stroke="#6F7D82"/>
        <path d="M11 14 H27 M11 19 H24 M11 24 H21" stroke="#A4B0B2" stroke-width="2" stroke-linecap="round"/>
        <text x="56" y="15" fill="#E7E3DA" font-size="17" font-weight="700">融合意图信号</text>
        <text x="56" y="36" fill="#858A89" font-size="14">LLM · Embedding · 关键词模式</text>
      </g>

      <g transform="translate(30 286)">
        <circle cx="19" cy="19" r="19" fill="#221F19" stroke="#A98755"/>
        <circle cx="13" cy="15" r="3" fill="#C8A66F"/>
        <circle cx="25" cy="15" r="3" fill="#C8A66F"/>
        <circle cx="19" cy="25" r="3" fill="#C8A66F"/>
        <path d="M15 17 L18 22 M23 17 L20 22" stroke="#C8A66F" stroke-width="2"/>
        <text x="56" y="15" fill="#E7E3DA" font-size="17" font-weight="700">路由专业 Agent</text>
        <text x="56" y="36" fill="#858A89" font-size="14">Course Agent 主答 · 按需协作</text>
      </g>

      <g transform="translate(30 346)">
        <circle cx="19" cy="19" r="19" fill="#1D2020" stroke="#777C76"/>
        <path d="M11 13 H27 V25 H11 Z M14 17 H24 M14 21 H21" fill="none" stroke="#B9B6AB" stroke-width="2" stroke-linejoin="round"/>
        <text x="56" y="15" fill="#E7E3DA" font-size="17" font-weight="700">检索精确与语义证据</text>
        <text x="56" y="36" fill="#858A89" font-size="14">Course Index · Knowledge Docs</text>
      </g>

      <g transform="translate(22 412)">
        <rect width="414" height="38" rx="12" fill="#1A211D" stroke="#56695B"/>
        <circle cx="20" cy="19" r="5" fill="#8FA18F"/>
        <text x="35" y="24" fill="#C8D0C5" font-size="15" font-weight="650">回答遵守快照时间与学业建议规则</text>
      </g>
