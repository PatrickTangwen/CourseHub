<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">CourseHub 如何生成一个回答</title>
  <desc id="desc">召回记忆、融合意图、多 Agent 路由、混合证据检索和受约束的双语回答。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#EEF6FF"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2DD4BF"/>
      <stop offset="0.5" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#F5A524"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1E293B" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1200" height="430" rx="28" fill="url(#bg)"/>
  <path d="M80 192 H1114" stroke="url(#line)" stroke-width="4" stroke-linecap="round" opacity="0.65"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif">
    <text x="54" y="55" fill="#0F172A" font-size="28" font-weight="760">一个问题，五个可观察阶段</text>
    <text x="54" y="83" fill="#64748B" font-size="17">界面时间线与后端发出的类型化事件保持一致。</text>
    <rect x="908" y="37" width="238" height="36" rx="18" fill="#E0F2FE"/>
    <circle cx="932" cy="55" r="5" fill="#0284C7"/>
    <text x="946" y="61" fill="#075985" font-size="14" font-weight="700">POST /chat/stream · SSE</text>

    <g transform="translate(42 120)" filter="url(#shadow)">
      <rect width="202" height="214" rx="20" fill="#FFFFFF" stroke="#CFE9E5"/>
      <circle cx="28" cy="28" r="15" fill="#CCFBF1"/>
      <text x="28" y="34" text-anchor="middle" fill="#0F766E" font-size="16" font-weight="800">1</text>
      <text x="22" y="79" fill="#0F172A" font-size="20" font-weight="760">召回上下文</text>
      <text x="22" y="108" fill="#475569" font-size="16">有界读取工作记忆、</text>
      <text x="22" y="133" fill="#475569" font-size="16">情景记忆和画像信号，</text>
      <text x="22" y="158" fill="#475569" font-size="16">不展示记忆正文。</text>
      <rect x="22" y="174" width="61" height="24" rx="12" fill="#F0FDFA"/>
      <text x="35" y="191" fill="#0F766E" font-size="12" font-weight="700">Redis</text>
      <rect x="91" y="174" width="86" height="24" rx="12" fill="#F0FDFA"/>
      <text x="104" y="191" fill="#0F766E" font-size="12" font-weight="700">ChromaDB</text>
    </g>

    <g transform="translate(270 120)" filter="url(#shadow)">
      <rect width="202" height="214" rx="20" fill="#FFFFFF" stroke="#CDE7F4"/>
      <circle cx="28" cy="28" r="15" fill="#E0F2FE"/>
      <text x="28" y="34" text-anchor="middle" fill="#0369A1" font-size="16" font-weight="800">2</text>
      <text x="22" y="79" fill="#0F172A" font-size="20" font-weight="760">融合意图信号</text>
      <text x="22" y="108" fill="#475569" font-size="16">三种独立信号共同</text>
      <text x="22" y="133" fill="#475569" font-size="16">判断问题属于事实、</text>
      <text x="22" y="158" fill="#475569" font-size="16">规划还是一般意图。</text>
      <g font-size="11" font-weight="700">
        <rect x="22" y="174" width="44" height="24" rx="12" fill="#EFF6FF"/>
        <text x="33" y="191" fill="#1D4ED8">LLM</text>
        <rect x="72" y="174" width="62" height="24" rx="12" fill="#EFF6FF"/>
        <text x="82" y="191" fill="#1D4ED8">向量</text>
        <rect x="140" y="174" width="42" height="24" rx="12" fill="#EFF6FF"/>
        <text x="149" y="191" fill="#1D4ED8">规则</text>
      </g>
    </g>

    <g transform="translate(498 120)" filter="url(#shadow)">
      <rect width="202" height="214" rx="20" fill="#FFFFFF" stroke="#DBD9F8"/>
      <circle cx="28" cy="28" r="15" fill="#EEF2FF"/>
      <text x="28" y="34" text-anchor="middle" fill="#4F46E5" font-size="16" font-weight="800">3</text>
      <text x="22" y="79" fill="#0F172A" font-size="20" font-weight="760">路由专业 Agent</text>
      <text x="22" y="108" fill="#475569" font-size="16">选择一个主 Agent；</text>
      <text x="22" y="133" fill="#475569" font-size="16">问题跨领域时再加入</text>
      <text x="22" y="158" fill="#475569" font-size="16">辅助 Agent 协作。</text>
      <g font-size="12" font-weight="800">
        <circle cx="45" cy="186" r="14" fill="#F1F5F9"/><text x="45" y="191" text-anchor="middle" fill="#334155">G</text>
        <circle cx="91" cy="186" r="14" fill="#E0E7FF"/><text x="91" y="191" text-anchor="middle" fill="#4338CA">C</text>
        <circle cx="137" cy="186" r="14" fill="#FEF3C7"/><text x="137" y="191" text-anchor="middle" fill="#A16207">P</text>
        <path d="M59 186 H76 M105 186 H122" stroke="#94A3B8" stroke-width="2"/>
      </g>
    </g>

    <g transform="translate(726 120)" filter="url(#shadow)">
      <rect width="202" height="214" rx="20" fill="#FFFFFF" stroke="#D9E2F9"/>
      <circle cx="28" cy="28" r="15" fill="#EEF2FF"/>
      <text x="28" y="34" text-anchor="middle" fill="#4338CA" font-size="16" font-weight="800">4</text>
      <text x="22" y="79" fill="#0F172A" font-size="20" font-weight="760">检索真实证据</text>
      <text x="22" y="108" fill="#475569" font-size="16">结构化精确事实与</text>
      <text x="22" y="133" fill="#475569" font-size="16">语义课程材料在同一</text>
      <text x="22" y="158" fill="#475569" font-size="16">回答链路中协同。</text>
      <rect x="22" y="174" width="70" height="24" rx="12" fill="#EEF2FF"/>
      <text x="33" y="191" fill="#4338CA" font-size="11" font-weight="700">INDEX</text>
      <rect x="100" y="174" width="78" height="24" rx="12" fill="#EEF2FF"/>
      <text x="112" y="191" fill="#4338CA" font-size="11" font-weight="700">DOCS</text>
    </g>

    <g transform="translate(954 120)" filter="url(#shadow)">
      <rect width="202" height="214" rx="20" fill="#FFFFFF" stroke="#F0DFC1"/>
      <circle cx="28" cy="28" r="15" fill="#FEF3C7"/>
      <text x="28" y="34" text-anchor="middle" fill="#A16207" font-size="16" font-weight="800">5</text>
      <text x="22" y="79" fill="#0F172A" font-size="20" font-weight="760">约束回答</text>
      <text x="22" y="108" fill="#475569" font-size="16">执行语言、快照时间、</text>
      <text x="22" y="133" fill="#475569" font-size="16">成绩口径和官方转介</text>
      <text x="22" y="158" fill="#475569" font-size="16">等领域规则。</text>
      <rect x="22" y="174" width="155" height="24" rx="12" fill="#FFFBEB"/>
      <circle cx="37" cy="186" r="4" fill="#F59E0B"/>
      <text x="49" y="191" fill="#92400E" font-size="11" font-weight="700">有依据的回答</text>
    </g>

    <g fill="#38BDF8">
      <path d="M248 219 L263 228 L248 237 Z"/>
      <path d="M476 219 L491 228 L476 237 Z"/>
      <path d="M704 219 L719 228 L704 237 Z"/>
      <path d="M932 219 L947 228 L932 237 Z"/>
    </g>

    <g transform="translate(54 368)">
      <rect width="1092" height="40" rx="20" fill="#0F172A"/>
      <circle cx="23" cy="20" r="5" fill="#5EEAD4"/>
      <text x="40" y="26" fill="#E2E8F0" font-size="15" font-weight="650">展示透明遥测，不暴露隐藏推理：</text>
      <text x="274" y="26" fill="#94A3B8" font-size="15">只展示阶段、路由决定、工具状态、耗时和安全计数。</text>
    </g>
  </g>
</svg>
