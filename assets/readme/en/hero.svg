      <circle cx="86" cy="373" r="4" fill="#5EEAD4"/>
      <text x="99" y="379" fill="#CCFBF1">Bilingual</text>
      <rect x="194" y="354" width="170" height="38" rx="19" fill="#122334" stroke="#38BDF8" stroke-opacity="0.38"/>
      <circle cx="214" cy="373" r="4" fill="#38BDF8"/>
      <text x="227" y="379" fill="#E0F2FE">Source-grounded</text>
      <rect x="374" y="354" width="126" height="38" rx="19" fill="#122334" stroke="#FFD166" stroke-opacity="0.38"/>
      <circle cx="394" cy="373" r="4" fill="#FFD166"/>
      <text x="407" y="379" fill="#FEF3C7">Self-hosted</text>
    </g>

    <g transform="translate(64 438)">
      <g>
        <text y="0" fill="#F8FAFC" font-size="28" font-weight="760">15</text>
        <text y="25" fill="#64748B" font-size="14" font-weight="700" letter-spacing="1.4">TERMS</text>
      </g>
      <line x1="83" y1="-18" x2="83" y2="32" stroke="#334155"/>
      <g transform="translate(108)">
        <text y="0" fill="#F8FAFC" font-size="28" font-weight="760">19K</text>
        <text y="25" fill="#64748B" font-size="14" font-weight="700" letter-spacing="1.1">COURSE-TERMS</text>
      </g>
      <line x1="250" y1="-18" x2="250" y2="32" stroke="#334155"/>
      <g transform="translate(276)">
        <text y="0" fill="#F8FAFC" font-size="28" font-weight="760">61K</text>
        <text y="25" fill="#64748B" font-size="14" font-weight="700" letter-spacing="1.4">SECTIONS</text>
      </g>
      <line x1="375" y1="-18" x2="375" y2="32" stroke="#334155"/>
      <g transform="translate(401)">
        <text y="0" fill="#F8FAFC" font-size="28" font-weight="760">15K</text>
        <text y="25" fill="#64748B" font-size="14" font-weight="700" letter-spacing="1.4">GRADE RECORDS</text>
      </g>
    </g>

    <g transform="translate(678 46)" filter="url(#shadow)">
      <rect width="458" height="468" rx="24" fill="#0B1322" stroke="#23324A" stroke-width="1.5"/>
      <rect x="1" y="1" width="456" height="58" rx="23" fill="#101B2D"/>
      <circle cx="26" cy="29" r="5" fill="#34D399"/>
      <text x="42" y="35" fill="#CBD5E1" font-size="16" font-weight="700" letter-spacing="1.3">LIVE ANSWER PIPELINE</text>
      <rect x="353" y="18" width="80" height="25" rx="12.5" fill="#0B2A29"/>
      <text x="372" y="35" fill="#5EEAD4" font-size="13" font-weight="700">running</text>

      <g transform="translate(22 78)">
        <rect width="414" height="64" rx="16" fill="#141F31" stroke="#2A3A52"/>
        <text x="18" y="25" fill="#64748B" font-size="13" font-weight="700" letter-spacing="1">QUESTION</text>
        <text x="18" y="49" fill="#F1F5F9" font-size="18" font-weight="600">Who teaches CSE 101 in FA26?</text>
      </g>

      <path d="M49 159 V388" fill="none" stroke="#27364B" stroke-width="2"/>

      <g transform="translate(30 166)">
        <circle cx="19" cy="19" r="19" fill="#102F31" stroke="#2DD4BF"/>
        <path d="M12 19 C16 13 22 13 26 19 C22 25 16 25 12 19 Z" fill="none" stroke="#5EEAD4" stroke-width="2"/>
        <circle cx="19" cy="19" r="3" fill="#5EEAD4"/>
        <text x="56" y="15" fill="#F1F5F9" font-size="17" font-weight="700">Recall context</text>
        <text x="56" y="36" fill="#64748B" font-size="14">working · episodic · profile</text>
      </g>

      <g transform="translate(30 226)">
        <circle cx="19" cy="19" r="19" fill="#10263A" stroke="#38BDF8"/>
        <path d="M11 14 H27 M11 19 H24 M11 24 H21" stroke="#7DD3FC" stroke-width="2" stroke-linecap="round"/>
        <text x="56" y="15" fill="#F1F5F9" font-size="17" font-weight="700">Fuse intent signals</text>
        <text x="56" y="36" fill="#64748B" font-size="14">LLM · embedding · keyword patterns</text>
      </g>

      <g transform="translate(30 286)">
        <circle cx="19" cy="19" r="19" fill="#302817" stroke="#FBBF24"/>
        <circle cx="13" cy="15" r="3" fill="#FFD166"/>
        <circle cx="25" cy="15" r="3" fill="#FFD166"/>
        <circle cx="19" cy="25" r="3" fill="#FFD166"/>
        <path d="M15 17 L18 22 M23 17 L20 22" stroke="#FFD166" stroke-width="2"/>
        <text x="56" y="15" fill="#F1F5F9" font-size="17" font-weight="700">Route specialists</text>
        <text x="56" y="36" fill="#64748B" font-size="14">Course Agent leads · support on demand</text>
      </g>

      <g transform="translate(30 346)">
        <circle cx="19" cy="19" r="19" fill="#1B2440" stroke="#818CF8"/>
        <path d="M11 13 H27 V25 H11 Z M14 17 H24 M14 21 H21" fill="none" stroke="#A5B4FC" stroke-width="2" stroke-linejoin="round"/>
        <text x="56" y="15" fill="#F1F5F9" font-size="17" font-weight="700">Retrieve exact + semantic evidence</text>
        <text x="56" y="36" fill="#64748B" font-size="14">Course Index · Knowledge Docs</text>
      </g>

      <g transform="translate(22 412)">
        <rect width="414" height="38" rx="12" fill="#102A28" stroke="#285B55"/>
        <circle cx="20" cy="19" r="5" fill="#5EEAD4"/>
        <text x="35" y="24" fill="#CCFBF1" font-size="15" font-weight="650">Answer constrained by snapshot + advising rules</text>
      </g>
