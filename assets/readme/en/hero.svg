<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">CourseHub</title>
  <desc id="desc">A bilingual, source-grounded UCSD course assistant with a transparent multi-agent pipeline.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070B14"/>
      <stop offset="0.58" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#101C2E"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFD166"/>
      <stop offset="1" stop-color="#F5A524"/>
    </linearGradient>
    <linearGradient id="aqua" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5EEAD4"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#7DD3FC" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#020617" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1200" height="560" rx="30" fill="url(#bg)"/>
  <rect width="1200" height="560" rx="30" fill="url(#grid)"/>
  <path d="M0 475 C250 420 480 530 720 468 C915 418 1035 431 1200 386 V560 H0 Z" fill="#38BDF8" opacity="0.035"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
    <g transform="translate(66 58)">
      <rect width="52" height="52" rx="14" fill="#FFD166"/>
      <path d="M13 19 H39 M18 11 V20 M34 11 V20 M14 18 V39 H38 V18" fill="none" stroke="#111827" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M21 27 H31 M21 34 H28" stroke="#111827" stroke-width="3" stroke-linecap="round"/>
      <text x="69" y="20" fill="#94A3B8" font-size="17" font-weight="700" letter-spacing="2.2">UCSD COURSE INTELLIGENCE</text>
      <text x="69" y="44" fill="#64748B" font-size="16">grounded answers · visible process</text>
    </g>

    <text x="64" y="214" fill="#F8FAFC" font-size="86" font-weight="780" letter-spacing="-4">CourseHub</text>
    <rect x="66" y="239" width="92" height="5" rx="3" fill="url(#gold)"/>
    <text x="66" y="282" fill="#E2E8F0" font-size="29" font-weight="650">Ask about classes.</text>
    <text x="66" y="318" fill="#94A3B8" font-size="29">See how the answer is built.</text>

    <g font-size="16" font-weight="650">
